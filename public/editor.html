<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Özel Notlarım</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://p.trellocdn.com/power-up.min.js" defer></script>
  <script src="editor.js" type="module"></script>
</head>
<body>
  <main>
    <p class="privacy">Yalnızca Trello hesabınız görebilir.</p>
    <form id="editor">
      <fieldset id="fields" disabled>
        <label for="note">NOTUM</label>
        <textarea id="note" rows="5" placeholder="Bu kart hakkında kendinize bir not bırakın…"></textarea>
        <div class="section-heading"><h1>CHECKLIST</h1><span id="progress">0 / 0</span></div>
        <ul id="items" aria-label="Checklist maddeleri"></ul>
        <button id="add" type="button" class="secondary">+ Madde ekle</button>
      </fieldset>
      <footer>
        <label class="capacity-label" for="capacity">Depolama <span id="usage">— / 4096</span></label>
        <meter id="capacity" min="0" max="4096" value="0" aria-label="Kullanılan depolama"></meter>
        <p id="limit" class="error" hidden>Depolama sınırı aşıldı. Kaydetmek için notu veya maddeleri kısaltın.</p>
        <p id="status" role="status" aria-live="polite">Yükleniyor…</p>
        <button id="save" type="submit" disabled>Kaydet</button>
        <button id="retry" type="button" class="secondary" hidden>Yeniden yükle</button>
        <p class="hint">Kapatmadan önce kaydedin. Kaydedilmemiş değişiklikler pencere kapanınca kaybolur.</p>
      </footer>
    </form>
  </main>
</body>
</html>
